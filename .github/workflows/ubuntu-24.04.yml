name: Ubuntu 24.04

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
      - development

jobs:
  ci:
    name: ${{ matrix.compiler }}-${{ matrix.manager }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      cache-name: cache-v5-${{ matrix.compiler }}-${{ matrix.manager }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_SLOPPINESS: include_file_mtime,pch_defines,time_macros
      CCACHE_MAXSIZE: 384M
      INSTALL_DIR: ${{ github.workspace }}/install/github-actions-${{ matrix.manager }}
    strategy:
      fail-fast: false # True stops all on first error. Stick to false when debugging
      matrix:
        include:
          - { compiler: gcc,   manager: cmake, coverage: true  }
          - { compiler: gcc,   manager: conan, coverage: false }
          - { compiler: clang, manager: conan, coverage: false }

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: lukka/get-cmake@v4.3.2
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Upgrade Python tooling
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Update apt
        run: sudo apt-get update

      - name: Prepare cache directories
        run: mkdir -p "$CCACHE_DIR" ~/.conan2 "$INSTALL_DIR"

      - name: Restore ccache
        id: restore-ccache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ github.workflow }}-${{ env.cache-name }}-ccache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ github.workflow }}-${{ env.cache-name }}-ccache-

      - name: Restore dependency install cache
        id: restore-deps
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.INSTALL_DIR }}
          key: ${{ github.workflow }}-${{ env.cache-name }}-deps-${{ hashFiles('CMakePresets.json', 'cmake/**/*.cmake', 'conanfile.*') }}
          restore-keys: |
            ${{ github.workflow }}-${{ env.cache-name }}-deps-

      - name: Restore conan cache
        if: matrix.manager == 'conan'
        id: restore-conan
        uses: actions/cache/restore@v5
        with:
          path: ~/.conan2
          key: ${{ github.workflow }}-${{ env.cache-name }}-conan-${{ hashFiles('conanfile.*') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ github.workflow }}-${{ env.cache-name }}-conan-${{ hashFiles('conanfile.*') }}-
            ${{ github.workflow }}-${{ env.cache-name }}-conan-

      - name: Setup gcc
        if: matrix.compiler == 'gcc'
        run: |
          sudo apt-get install gcc-14 g++-14 -y
          echo "FC=gfortran-14" >> $GITHUB_ENV
          echo "CC=gcc-14"      >> $GITHUB_ENV
          echo "CXX=g++-14"     >> $GITHUB_ENV

      - name: Setup clang
        if: matrix.compiler == 'clang'
        run: |
          sudo apt-get install clang-18 libomp-18-dev -y
          echo "FC=gfortran-14" >> $GITHUB_ENV
          echo "CC=clang-18"    >> $GITHUB_ENV
          echo "CXX=clang++-18" >> $GITHUB_ENV

      - name: Setup apt packages
        run: |
          sudo apt-get install ccache ninja-build mold gcovr lcov gfortran-14 libgfortran-14-dev libstdc++-14-dev libdw-dev -y
          sudo apt-get install libopenblas-dev liblapack-dev liblapacke-dev libopenmpi-dev openmpi-bin autopoint -y

      - name: Configure ccache
        run: |
          ccache --set-config=max_size=${CCACHE_MAXSIZE}
          ccache --show-config
          ccache --zero-stats

      - name: Install conan
        if: matrix.manager == 'conan'
        run: |
          python -m pip install --upgrade conan
          mkdir -p ~/.conan2
          {
            echo "core.net.http:timeout=90"
            echo "core.download:retry=5"
            echo "core.download:retry_wait=5"
            echo "tools.files.download:retry=5"
            echo "tools.files.download:retry_wait=5"
          } >> ~/.conan2/global.conf
          conan profile detect --force

      - name: Setup OpenBLAS core type
        run: echo "OPENBLAS_CORETYPE=NEHALEM" >> $GITHUB_ENV

      - name: Configure and build
        uses: lukka/run-cmake@v10.9
        with:
          configurePreset: 'github-actions-${{ matrix.manager }}'
          configurePresetAdditionalArgs: "['-DCMAKE_INSTALL_PREFIX=${{ env.INSTALL_DIR }}','-DCOMPILER_ENABLE_COVERAGE=${{ matrix.coverage && 'TRUE' || 'FALSE' }}']"
          buildPreset: 'github-actions-${{ matrix.manager }}'

      - name: Show ccache stats
        if: always()
        run: ccache --show-stats

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.restore-ccache.outputs.cache-primary-key }}

      - name: Save dependency install cache
        if: success() && steps.restore-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: ${{ env.INSTALL_DIR }}
          key: ${{ steps.restore-deps.outputs.cache-primary-key }}

      - name: Save conan cache
        if: matrix.manager == 'conan' && success()
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: ~/.conan2
          key: ${{ steps.restore-conan.outputs.cache-primary-key }}

      - name: Test
        run: ctest --preset github-actions-${{ matrix.manager }} --output-on-failure

      - name: Coverage
        if: matrix.compiler == 'gcc' && matrix.manager == 'cmake'
        run: |
          # Create lcov report
          lcov --gcov-tool=gcov-14 --capture --directory build/github-actions-${{ matrix.manager }} --output-file coverage.info
          lcov --gcov-tool=gcov-14 --remove coverage.info '*/install/*' '*/test-*' '/usr/*' 'include/c++/*' '*include/fmt/*' '*include/spdlog/*' '*/Eigen/*' '*/hdf5/*' '*catch.hpp' --output-file coverage.info # filter system-files
          lcov --gcov-tool=gcov-14 --list coverage.info # debug info

      - name: Upload coverage to Codecov
        if: matrix.compiler == 'gcc' && matrix.manager == 'cmake'
        uses: codecov/codecov-action@v6
        with:
          use_oidc: true
          files: coverage.info
          disable_search: true
          fail_ci_if_error: true
          verbose: true
