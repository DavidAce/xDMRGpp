name: Ubuntu 22.04

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
      - development

jobs:
  ci:
    name: ${{ matrix.compiler }}-${{ matrix.manager }}
    runs-on: ubuntu-22.04
    env:
      cache-name: cache-v4-${{ matrix.compiler }}-${{ matrix.manager }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_SLOPPINESS: include_file_mtime,pch_defines,time_macros
      CCACHE_MAXSIZE: 384M
      INSTALL_DIR: ${{ github.workspace }}/install/github-actions-${{ matrix.manager }}
    strategy:
      fail-fast: false # True stops all on first error. Stick to false when debugging
      matrix:
        include:
          - { compiler: gcc,   manager: cmake, coverage: false }
          - { compiler: gcc,   manager: conan, coverage: false }
          - { compiler: clang, manager: conan, coverage: false }


    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: lukka/get-cmake@v4.2.0
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Upgrade Python tooling
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Update apt
        run: sudo apt-get update

      - name: Prepare cache directories
        run: mkdir -p "$CCACHE_DIR" ~/.conan2 "$INSTALL_DIR"

      - name: Setup ccache + dependency-provider cache
        if: matrix.manager == 'cmake'
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.CCACHE_DIR }}
            ${{ env.INSTALL_DIR }}
          key: ${{ github.workflow }}-${{ env.cache-name }}

      - name: Setup ccache + conan cache
        if: matrix.manager == 'conan'
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.CCACHE_DIR }}
            ~/.conan2
          key: ${{ github.workflow }}-${{ env.cache-name }}

      - name: Setup gcc
        if: matrix.compiler == 'gcc'
        run: |
          sudo apt-get install gcc-12 g++-12 -y
          echo "FC=gfortran-12" >> $GITHUB_ENV
          echo "CC=gcc-12"      >> $GITHUB_ENV
          echo "CXX=g++-12"     >> $GITHUB_ENV

      - name: Setup clang
        if: matrix.compiler == 'clang'
        run: |
          sudo apt-get install clang-15 libomp-15-dev -y
          echo "FC=gfortran-12" >> $GITHUB_ENV
          echo "CC=clang-15"    >> $GITHUB_ENV
          echo "CXX=clang++-15" >> $GITHUB_ENV

      - name: Setup apt packages
        run: |
          sudo apt-get install ccache ninja-build mold gcovr lcov gfortran-12 libgfortran-12-dev libstdc++-12-dev libdw-dev -y
          sudo apt-get install libopenblas-dev liblapack-dev liblapacke-dev libopenmpi-dev openmpi-bin autopoint -y

      - name: Configure ccache
        run: |
          ccache --set-config=max_size=${CCACHE_MAXSIZE}
          ccache --show-config

      - name: Install conan
        if: matrix.manager == 'conan'
        run: |
          python -m pip install --upgrade conan
          mkdir -p ~/.conan2
          {
            echo "core.net.http:timeout=90"
            echo "core.download:retry=5"
            echo "core.download:retry_wait=5"
            echo "tools.files.download:retry=5"
            echo "tools.files.download:retry_wait=5"
          } >> ~/.conan2/global.conf
          conan profile detect --force
          conan remote add conan-dmrg https://neumann.theophys.kth.se/artifactory/api/conan/conan-dmrg --force

      - name: Setup OpenBLAS core type
        run: echo "OPENBLAS_CORETYPE=NEHALEM" >> $GITHUB_ENV

      - name: Run CMakePreset
        uses: lukka/run-cmake@v10.8
        with:
          configurePreset: 'github-actions-${{ matrix.manager }}'
          configurePresetAdditionalArgs: "['-DCMAKE_INSTALL_PREFIX=${{ env.INSTALL_DIR }}','-DCOMPILER_ENABLE_COVERAGE=${{ matrix.coverage && 'TRUE' || 'FALSE' }}']"
          buildPreset: 'github-actions-${{ matrix.manager }}'
          testPreset: 'github-actions-${{ matrix.manager }}'

      - name: Show ccache stats
        run: ccache --show-stats
