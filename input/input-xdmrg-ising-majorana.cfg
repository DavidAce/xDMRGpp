model::ising_tf_rf::h_wdth                                      = 0.0                                  /*!< Random field width of distribution */
model::ising_tf_rf::spin_dim                                    = 2                                    /*!< Spin dimension */
model::ising_tf_rf::distribution                                = normal                               /*!< Random distribution for couplings and fields */

// Ising self-dual model
model::ising_sdual::lambda                                      = 0.0                                  /*!< Lambda parameter related to next nearest neighbor coupling */
model::ising_sdual::delta                                       = 0.0                                  /*!< Delta defined as log(J_mean) - log(h_mean). We get J_mean and h_mean by fixing max(J_mean,h_mean) = 1 */
model::ising_sdual::spin_dim                                    = 2                                    /*!< Spin dimension */
model::ising_sdual::distribution                                = uniform                              /*!< Random distribution for couplings and fields */

// Ising-Majorana model
model::ising_majorana::g                                        = 0.500                                /*!< Interaction parameter for nearest ZZ and next-nearest XX neighbor coupling */
model::ising_majorana::delta                                    = +3.50                                /*!< Delta defined as log(J_mean) - log(h_mean). We get J_mean and h_mean by fixing delta = 2lnW, W = J_wdth = 1/h_wdth */
model::ising_majorana::spin_dim                                 = 2                                    /*!< Spin dimension */
model::ising_majorana::distribution                             = uniform                              /*!< Random distribution for couplings and fields (currently uniform only) */

// l-bit model
model::lbit::J1_mean                                            = 0.00                                 /*!< Constant offset for onsite terms */
