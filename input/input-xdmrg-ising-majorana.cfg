// Storage settings
// StoragePolicy is a bitflag. A save is triggered when the current StorageEvent matches
// any trigger flag in the policy; modifier flags then refine how that write is kept.
//
// Available StoragePolicy flags:
//   - NONE    : never store
//   - INIT    : store during initialization or preprocessing
//   - ITER    : store on iteration events (see storage_interval)
//   - EMIN    : store after finding the minimum-energy state
//   - EMAX    : store after finding the maximum-energy state
//   - PROJ    : store after projection steps
//   - BOND    : store after bond-dimension updates
//   - TRNC    : store after truncation-limit updates
//   - FAILURE : store only on unsuccessful termination
//   - SUCCESS : store only on successful termination
//   - FINISH  : store when the algorithm finishes, regardless of success
//   - ALWAYS  : store whenever a save opportunity is encountered
//   - REPLACE : keep only the latest matching entry when possible
//   - RBDS    : store reverse-bond-dimension-scaling follow-up steps
//   - RTES    : store reverse-truncation-error-scaling follow-up steps
//
// Example bitflag combinations:
//   - ITER|REPLACE: keep only the latest per-iteration snapshot
//   - ITER|FINISH|REPLACE: keep the latest iterative snapshot and the final one
//   - FINISH|RBDS|RTES: store the final state and the rbds/rtes follow-up steps
//   - ITER|BOND|TRNC|RBDS|RTES: store iterations, bond/truncation updates, and rbds/rtes steps
//
// Resume note: finite-state resume requires a fully stored MPS under the selected state prefix.
// fLBIT can also resume from its time-evolution data.

storage::output_filepath                                        = output/output.h5                     /*!< Name of the output HDF5 file relative to the execution point */
storage::output_append_seed                                     = true                                 /*!< Append the seed for the random number generator to output_filepath */
storage::storage_interval                                       = 1                                    /*!< Write to file this often, in units of iterations. Applies to StorageEvent::Iteration. */
storage::use_temp_dir                                           = true                                 /*!< If true uses a temporary directory for writes in the local drive (usually /tmp) and copies the results afterwards */
storage::copy_from_temp_freq                                    = 4                                    /*!< How often, in units of iterations, to copy the hdf5 file in tmp dir to target destination */
storage::temp_dir                                               = /tmp/DMRG                            /*!< Local temp directory on the local system. If it does not exist we default to /tmp instead (or whatever is the default) */
storage::compression_level                                      = 1                                    /*!< GZip compression level in HDF5. Choose between [0-9] (0 = off, 9 = max compression) */
storage::resume_policy                                          = IF_UNSUCCESSFUL                      /*!< Which exit conditions from a previous run qualify a state for resume */
