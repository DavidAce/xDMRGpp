model::lbit::J1_wdth                                            = 1.00                                 /*!< Distribution width for onsite terms */
model::lbit::J2_wdth                                            = 1.00                                 /*!< Distribution width for nearest-neighbor interactions (st.dev. for normal distribution) */
model::lbit::J3_wdth                                            = 1.00                                 /*!< Distribution width for next-nearest-neighbor interactions */
model::lbit::J2_span                                            = -1                                   /*!< Maximum allowed range for pairwise interactions, |i-j| <= J2_span. Use -1 for infinite. Note that J2_span + 1 MPOs are used */
model::lbit::xi_Jcls                                            = 1.00                                 /*!< The characteristic length-scale xi of the exponentially decaying interactions: J = exp(-|i-j|/xi_Jcls) * Random(i,j) */
model::lbit::spin_dim                                           = 2                                    /*!< Spin dimension */
model::lbit::distribution                                       = normal                               /*!< Random distribution used for the l-bit couplings */
model::lbit::u_fmix                                             = 0.2                                  /*!< Overall gate amplitude factor f in the unitary circuit, U = exp(-i f w M) */
