# Batch in 2025 for xDMRG with the new GD+k, JD correction equation
# solved with MINRES with internal block-jacobi preconditioner.
# We also have a new eigensolver-based environment expansion routine.
#
# The seeds encode the Hamiltonian parameters:
#   Eg:  1|600|0000|00000
#        +-| d | g  | extra
#
# The seeds start with 1 for negative delta, and 2 for positive.
# The second digit represents the d-value.
# The remaining digits reveal the decimals of g.

[experiment]
name                 = "xdmrg6-gdplusk"
project_name         = "xdmrg6-gdplusk"
family               = "xdmrg6-gdplusk"
template             = "slurm2/template_configs/xdmrg-ising-majorana.cfg"
output_stem          = "mbl"
point_id_template    = "L{L}_g{g:.3f}_d{d:+.2f}"
output_dir_template  = "output/L{L}/g{g:.3f}/d{d:+.2f}"
config_stem_template = "{output_stem}_{point_id}"

[experiment.token_map]
L = "settings.model.model_size"
d = "settings.model.ising_majorana.delta"
g = "settings.model.ising_majorana.g"

[defaults]
settings.console.loglevel              = "2"
settings.storage.resume_policy         = "IF_UNSUCCESSFUL"
settings.storage.file_collision_policy = "REVIVE"
settings.strategy.initial_state        = "PRODUCT_STATE_NEEL_SHUFFLED"
settings.model.model_type              = "ising_majorana"
settings.xdmrg.energy_spectrum_shift   = "0.0"

[groups.L12_L14_L16]
model_sizes             = ["12", "14", "16"]
scan_extent             = 1000
settings.xdmrg.iter_max = 600

[groups.L12_L14_L16.batch]
"d-8.00|g0.500" = { seed_extent = [1000], seed_offset = [1_800_0500_000000] }
"d-7.50|g0.500" = { seed_extent = [1000], seed_offset = [1_750_0500_000000] }
